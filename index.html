<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>PRAYAANA 2K26 | Staff Portal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(ellipse at top, #302052 0%, transparent 55%),
        linear-gradient(145deg, #090811, #151020 60%, #08070d);
    }

    .portal {
      width: 100%;
      max-width: 420px;
      padding: 40px 28px;
      text-align: center;
      background: rgba(22, 18, 35, 0.92);
      border: 1px solid #493361;
      border-radius: 22px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
    }

    .symbol {
      font-size: 38px;
      color: #c6a0ff;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 3px;
    }

    .subtitle {
      margin: 10px 0 30px;
      color: #c6a0ff;
      font-size: 12px;
      letter-spacing: 4px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .description {
      color: #c3bdcf;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 26px;
    }

    .google-button {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #66517e;
      border-radius: 10px;
      color: #ffffff;
      background: #302342;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .google-button:hover {
      background: #403052;
    }

    .status {
      margin-top: 18px;
      font-size: 12px;
      color: #c6a0ff;
    }

    .footer {
      margin-top: 30px;
      color: #827a91;
      font-size: 11px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="portal">
    <div class="symbol">✦</div>

    <h1>PRAYAANA 2K26</h1>
    <div class="subtitle">STAFF PORTAL</div>

    <h2>Welcome, Organizer</h2>

    <p class="description">
      Authorized staff access for registration verification,
      fee collection, ticket approval and event entry.
    </p>

   <button class="google-button" id="googleSignInButton" type="button">
  G&nbsp; Continue with Google
</button>

    <div class="status">
      Secure access setup in progress
    </div>

    <div class="footer">
      Authorized staff only<br>
      PRAYAANA 2K26 · Saribekyan Medical University Armenia
    </div>
  </main>
  
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyA8Tt3Ttz3ASauROEwfGHtC23z0edjXLOg",
    authDomain: "prayaana-2k26.firebaseapp.com",
    projectId: "prayaana-2k26",
    appId: "1:495679287568:web:99e90b86d65cb6beaa7595"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const googleProvider = new firebase.auth.GoogleAuthProvider();

  document.getElementById("googleSignInButton")
    .addEventListener("click", async () => {
      try {
        const result = await auth.signInWithPopup(googleProvider);
        alert("Signed in successfully as " + result.user.email);
      } catch (error) {
        console.error(error);
        alert("Sign-in failed: " + error.message);
      }
    });
</script>
  
</body>
</html>
